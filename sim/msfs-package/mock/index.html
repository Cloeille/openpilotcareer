<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPilotCareer EFB panel (browser mock)</title>
<link rel="stylesheet" href="/panel/OpenPilotCareer.css">
<style>
  html, body { margin: 0; height: 100%; background: #05080c; }
  body { display: flex; align-items: center; justify-content: center; }
  #opc-root { flex: none; width: 820px; height: 590px; }
</style>
</head>
<body>
  <div id="opc-root"></div>
  <script src="/panel/view-model.js"></script>
  <script src="/panel/panel.js"></script>
  <script>
    // ?lang=fr|en forces the language (default: the stored choice, then the browser's)
    var forced = new URLSearchParams(location.search).get('lang');
    OPCPanel.mount(document.getElementById('opc-root'), forced ? { lang: forced } : undefined).start();
  </script>
</body>
</html>
